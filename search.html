<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link href="./stylesheet.css" rel="stylesheet">
    </head>

    <body onload="init()">
        <script src="header.js"></script>

        <div class="left" id="filters">
            <input type="button" id="clearFilters" value="Clear Filters">
            <br><br>
            <span id="filtersApplied">0 filters applied</span>

            <h2>Location</h2>
                <ul id="locationList">
                    <li>
                        <label>
                            <input type="checkbox">Riverside South
                        </label>
                        <span class="filterCount">9</span>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">Stittsville
                        </label>
                        <span class="filterCount">10</span>
                    </li>
                </ul>

            <h2>Item Type</h2>
                <ul id="typeList">
                    <li>
                        <label>
                            <input type="checkbox">Book
                        </label>
                        <span class="filterCount">11</span>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">Audio Book
                        </label>
                        <span class="filterCount">12</span>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">DVD
                        </label>
                        <span class="filterCount">13</span>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">Blu-ray
                        </label>
                        <span class="filterCount">14</span>
                    </li>
                    <li>
                        <label>
                            <input type="checkbox">Other
                        </label>
                        <span class="filterCount">15</span>
                    </li>
                </ul>
            
            <h2>Section</h2>
            <div class="center">
                <input type="search" id="filterSearch" placeholder="Search sections...">
                <input type="image" id="filterImg" src="./searchIcon.png">
            </div>
            <ul id="sectionList"></ul>
            <span id="noSectionsFound" hidden="true">No sections were found</span>
        </div>

        <div id="results">
            <div class="center">
                <span id="numberFound">123 results found</span>
                
                <span id="pageList">
                    <input type="button" class="pageButton" value="<<">
                    <input type="button" class="pageButton" value="<">
                    <input type="button" class="pageButton" value="1">
                    <input type="button" class="pageButton" value="2">
                    <input type="button" class="pageButton" value="3">
                    <input type="button" class="pageButton" value="4">
                    <input type="button" class="pageButton" value="5">
                    <input type="button" class="pageButton" value=">">
                    <input type="button" class="pageButton" value=">>">
                </span>
                <span class="right">
                    Sort by:
                    <select id="sortDropdown">
                        <option value="titleAZ">Title A-Z</option>
                        <option value="titleZA">Title Z-A</option>
                        <option value="authorAZ">Author A-Z</option>
                        <option value="authorZA">Author Z-A</option>
                        <option value="priceLH">Price Low-High</option>
                        <option value="priceHL">Price High-Low</option>
                    </select>  
                </span>
            </div>
            <span class="right" id="updatedLabel"> Last updated on 2026/11/17 8:00 PM</span>

            <br><br>
            <ul id="resultsList">
                <li class="result">
                    lasjdkaldsjldklsdj<br> lasjdklasjdksdl <br> alksjhalskd
                </li>
            </ul>
            <div id="noResultsFound" hidden="true">
                <h1>No results found</h1>
                <div id="noResultsFeedback"></div>
            </div>
        </div>
        <input type="button" id="topButton" value="↑ Top of Page">
        <script src="./search.js"></script>
    </body>
</html>
